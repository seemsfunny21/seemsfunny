name: PEGASUS safety regression
on:
  push:
    branches:
      - main
      - maintenance/pegasus-309-safety
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run PEGASUS syntax, backup, timer and cache regressions
        run: node tests/safety-regression.cjs
